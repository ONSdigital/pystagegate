[project]
name = "pystagegate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "soderc", email = "christoffer.soderberg@ons.gov.uk" }
]
requires-python = ">=3.10"
dependencies = [
    "great-expectations>=1.19.1",
    "pandas>=2.3.3",
    "sdv>=1.37.3",
]

[project.scripts]
provfin = "pystagegate:run_prov_fin"
sexratio = "pystagegate:run_sex_ratio"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter-book<2.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "sphinx>=7.4.7",
]

[tool.ruff.lint]
extend-select = ["B"]
