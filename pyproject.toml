[project]
name = "pystagegate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "soderc", email = "christoffer.soderberg@ons.gov.uk" }
]
requires-python = ">=3.10"
dependencies = [
    "jupyter-book>=2.1.5",
    "pandas>=2.3.3",
]

[project.scripts]
pystagegate = "pystagegate:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.ruff.lint]
extend-select = ["B"]
